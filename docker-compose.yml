services:
  api:
    build: ./backend
    environment:
      FORGEFLOW_DB: /data/forgeflow.db
      CORS_ORIGINS: http://localhost:5174,http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - forgeflow-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  forgeflow-data:
